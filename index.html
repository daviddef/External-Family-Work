<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>External Family Work</title>
<meta name="description" content="Family-history research pages put together as favours." />
<meta http-equiv="refresh" content="0; url=vidakovic-vrban/" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Libre+Franklin:wght@400;500;600&display=swap" />
<style>
:root{
  --ground:#EDEBE5; --panel:#F7F6F2; --ink:#16222A; --ink-2:#4C5D66; --ink-3:#7C8A91;
  --rule:#D3D0C7; --accent:#8E2456;
  --serif:"EB Garamond",Georgia,"Times New Roman",serif;
  --sans:"Libre Franklin","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#101820; --panel:#17212A; --ink:#E8E6DF; --ink-2:#A6B4BC; --ink-3:#74858E;
  --rule:#2A3841; --accent:#E886B0;
}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--ground);color:var(--ink);font-family:var(--serif);text-align:center;padding:40px}
a{color:var(--accent)}
.card{max-width:520px}
h1{font-size:28px;font-weight:500;margin:0 0 10px}
p{font-family:var(--sans);font-size:14.5px;color:var(--ink-2);line-height:1.6;margin:0 0 18px}
ul{list-style:none;padding:0;margin:0;text-align:left;font-family:var(--sans);font-size:16px}
li{padding:12px 0;border-top:1px solid var(--rule)}
li:first-child{border-top:none}
</style>
</head>
<body>
<div class="card">
  <h1>External Family Work</h1>
  <p>Family-history research pages, put together as favours. Redirecting to the current one —
  or pick a project below.</p>
  <ul>
    <li><a href="vidakovic-vrban/">Vidaković &amp; Vrban — Sveti Rok</a></li>
  </ul>
</div>
</body>
</html>
